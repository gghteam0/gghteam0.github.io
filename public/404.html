<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GGH Team</title>
    <script>
      // SPA redirect for GitHub Pages: turns /some/route into /?/some/route
      // so index.html loads and restores the route (see restore script there).
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
